<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Street</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        font-family: 'Courier New', ui-monospace, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #c8f7ff;
      }
      /* Vignette + subtiele scanlines voor de cyberpunk-look */
      #hud::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(5, 2, 14, 0.55) 100%
        );
      }
      #hud::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 255, 255, 0.02) 3px,
          rgba(0, 255, 255, 0.02) 4px
        );
        mix-blend-mode: overlay;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid rgba(0, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 0, 170, 0.9);
      }
      #crosshair::before {
        left: 50%;
        top: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair::after {
        left: 50%;
        bottom: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair.hit {
        animation: hitmark 0.18s ease-out;
      }
      @keyframes hitmark {
        0% {
          transform: scale(1);
          border-color: rgba(255, 45, 149, 1);
          box-shadow: 0 0 20px rgba(255, 45, 149, 0.9);
        }
        100% {
          transform: scale(1.45);
          border-color: rgba(0, 255, 255, 0.85);
          box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        }
      }
      #scoreboard {
        position: absolute;
        top: 22px;
        left: 26px;
        padding: 10px 18px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        border-left: 3px solid rgba(255, 45, 149, 0.9);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 12px;
      }
      #scoreboard #kills {
        display: block;
        margin-top: 2px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #ff2d95;
        text-shadow: 0 0 14px rgba(255, 45, 149, 0.8);
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        padding: 12px 20px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-align: center;
        backdrop-filter: blur(6px);
        text-shadow: 0 0 8px rgba(0, 246, 255, 0.6);
      }
      #hint b {
        color: #ff2d95;
      }
      #crosshair.hidden,
      #scoreboard.hidden,
      #concept-panel.hidden,
      #hint.hidden {
        display: none;
      }
      #concept-panel {
        position: absolute;
        top: 22px;
        right: 26px;
        width: 280px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 45, 149, 0.4);
        border-right: 3px solid rgba(0, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.45;
        letter-spacing: 0.04em;
      }
      #concept-panel .concept-title {
        font-size: 14px;
        font-weight: 700;
        color: #00f6ff;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 4px;
      }
      #concept-panel .concept-tag {
        color: #ff2d95;
        font-size: 11px;
        margin-bottom: 8px;
      }
      #concept-panel .concept-pitch {
        color: #b8c8d8;
        margin-bottom: 10px;
      }
      #concept-panel .concept-keys {
        font-size: 11px;
        color: #8899aa;
        border-top: 1px solid rgba(0, 255, 255, 0.2);
        padding-top: 8px;
      }
      #concept-panel b {
        color: #ff2d95;
      }
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: auto;
        background: transparent;
      }
      #start-screen.hidden {
        display: none;
      }
      #start-ui {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        z-index: 1;
      }
      #title-logo {
        width: min(480px, 72vw);
        height: auto;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.65));
        animation: title-float 3.5s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
      }
      @keyframes title-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.01);
        }
      }
      #start-audio-hint {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(200, 247, 255, 0.65);
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        text-transform: uppercase;
      }
      #start-audio-hint.hidden {
        display: none;
      }
      #play-btn {
        font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
        font-size: 28px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #101018;
        background: linear-gradient(180deg, #ffd400 0%, #7ae020 55%, #5bc918 100%);
        border: 4px solid #1a1020;
        outline: 3px solid #ffd400;
        padding: 12px 56px 14px;
        cursor: pointer;
        box-shadow:
          0 6px 0 #1a1020,
          0 0 24px rgba(122, 224, 32, 0.55);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      #play-btn:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow:
          0 8px 0 #1a1020,
          0 0 36px rgba(255, 212, 0, 0.65);
      }
      #play-btn:active {
        transform: translateY(4px);
        box-shadow:
          0 2px 0 #1a1020,
          0 0 20px rgba(122, 224, 32, 0.45);
      }
      body.menu-mode #hud::before {
        opacity: 0.25;
      }
      body.menu-mode #hud::after {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="scoreboard">
        Neutralized
        <span id="kills">00</span>
      </div>
      <div id="concept-panel" class="hidden"></div>
      <div id="hint" class="hidden">
        <b>WASD</b> lopen · <b>Shift</b> sprinten ·
        <b>Muis</b> kijken · <b>1–4</b> grate-variant
      </div>
    </div>
    <div id="start-screen">
      <div id="start-ui">
        <img id="title-logo" src="/images/cyber-alley-logo.png" alt="Cyber Alley" />
        <button id="play-btn" type="button">PLAY</button>
        <div id="start-audio-hint" class="hidden">Klik voor muziek</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
