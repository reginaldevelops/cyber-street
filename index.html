<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Street</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        image-rendering: pixelated;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        font-family: 'Press Start 2P', 'Courier New', monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #c8f7ff;
      }
      #hud::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 52%,
          rgba(5, 2, 14, 0.62) 100%
        );
      }
      #hud::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.18) 2px,
          rgba(0, 0, 0, 0.18) 3px
        );
        mix-blend-mode: multiply;
        opacity: 0.85;
        pointer-events: none;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border: 2px solid rgba(0, 255, 255, 0.95);
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 45, 149, 1);
      }
      #crosshair::before {
        left: 50%;
        top: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair::after {
        left: 50%;
        bottom: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair.hit {
        animation: hitmark 0.18s steps(2, end);
      }
      @keyframes hitmark {
        0% { border-color: #ff2d95; }
        100% { border-color: #00f6ff; }
      }
      #scoreboard {
        position: absolute;
        top: 18px;
        left: 18px;
        padding: 12px 14px;
        border: 3px solid #00f6ff;
        border-left: 6px solid #ff2d95;
        background: #0a0810;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 8px;
        line-height: 1.6;
        box-shadow: 4px 4px 0 #ff2d95;
      }
      #scoreboard #kills {
        display: block;
        margin-top: 6px;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: #ff2d95;
        text-shadow: 2px 2px 0 #400020;
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 12px 16px;
        border: 3px solid #00f6ff;
        background: #0a0810;
        font-size: 8px;
        letter-spacing: 0.04em;
        text-align: center;
        line-height: 1.7;
        max-width: min(92vw, 720px);
        box-shadow: 4px 4px 0 #00f6ff;
        text-shadow: none;
      }
      #hint b {
        color: #ff2d95;
      }
      #crosshair.hidden,
      #scoreboard.hidden,
      #concept-panel.hidden,
      #hint.hidden {
        display: none;
      }
      #concept-panel {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 260px;
        padding: 12px;
        border: 3px solid #ff2d95;
        border-right: 6px solid #00f6ff;
        background: #0a0810;
        font-size: 7px;
        line-height: 1.7;
        letter-spacing: 0.02em;
        box-shadow: 4px 4px 0 #00f6ff;
      }
      #concept-panel .concept-title {
        font-size: 8px;
        font-weight: 400;
        color: #00f6ff;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }
      #concept-panel .concept-tag {
        color: #ff2d95;
        font-size: 7px;
        margin-bottom: 8px;
      }
      #concept-panel .concept-pitch {
        color: #b8c8d8;
        margin-bottom: 10px;
      }
      #concept-panel .concept-keys {
        font-size: 7px;
        color: #8899aa;
        border-top: 2px solid #00f6ff;
        padding-top: 8px;
      }
      #concept-panel b {
        color: #ff2d95;
      }
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: auto;
        background: transparent;
      }
      #start-screen.hidden {
        display: none;
      }
      #start-ui {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        z-index: 1;
      }
      #title-logo {
        width: min(680px, 86vw);
        height: auto;
        image-rendering: pixelated;
        filter: none;
        animation: title-float 1.2s steps(2, end) infinite;
        pointer-events: none;
        user-select: none;
      }
      @keyframes title-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      #start-audio-hint {
        font-size: 7px;
        letter-spacing: 0.08em;
        color: rgba(200, 247, 255, 0.75);
        text-shadow: 2px 2px 0 #000;
        text-transform: uppercase;
      }
      #start-audio-hint.hidden {
        display: none;
      }
      #play-btn {
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        font-weight: 400;
        font-style: normal;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #101018;
        background: #ffd400;
        border: 4px solid #1a1020;
        outline: 3px solid #7ae020;
        padding: 14px 40px 16px;
        cursor: pointer;
        box-shadow: 6px 6px 0 #1a1020;
        transition: none;
        image-rendering: pixelated;
      }
      #play-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0 #1a1020;
        background: #ffe566;
      }
      #play-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 #1a1020;
      }
      body.menu-mode #hud::before {
        opacity: 0.25;
      }
      body.menu-mode #hud::after {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="scoreboard">
        Neutralized
        <span id="kills">00</span>
      </div>
      <div id="concept-panel" class="hidden"></div>
      <div id="hint" class="hidden">
        <b>WASD</b> lopen · <b>Shift</b> sprinten ·
        <b>Muis</b> kijken · <b>1–4</b> grate-variant
      </div>
    </div>
    <div id="start-screen">
      <div id="start-ui">
        <img id="title-logo" src="/images/cyber-alley-logo.png" alt="Cyber Alley" />
        <button id="play-btn" type="button">PLAY</button>
        <div id="start-audio-hint" class="hidden">Klik voor muziek</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
