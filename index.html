<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Street</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        font-family: 'Courier New', ui-monospace, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #c8f7ff;
      }
      /* Vignette + subtiele scanlines voor de cyberpunk-look */
      #hud::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(5, 2, 14, 0.55) 100%
        );
      }
      #hud::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 255, 255, 0.02) 3px,
          rgba(0, 255, 255, 0.02) 4px
        );
        mix-blend-mode: overlay;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid rgba(0, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 0, 170, 0.9);
      }
      #crosshair::before {
        left: 50%;
        top: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair::after {
        left: 50%;
        bottom: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair.hit {
        animation: hitmark 0.18s ease-out;
      }
      @keyframes hitmark {
        0% {
          transform: scale(1);
          border-color: rgba(255, 45, 149, 1);
          box-shadow: 0 0 20px rgba(255, 45, 149, 0.9);
        }
        100% {
          transform: scale(1.45);
          border-color: rgba(0, 255, 255, 0.85);
          box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        }
      }
      #scoreboard {
        position: absolute;
        top: 22px;
        left: 26px;
        padding: 10px 18px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        border-left: 3px solid rgba(255, 45, 149, 0.9);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 12px;
      }
      #scoreboard #kills {
        display: block;
        margin-top: 2px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #ff2d95;
        text-shadow: 0 0 14px rgba(255, 45, 149, 0.8);
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        padding: 12px 20px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-align: center;
        backdrop-filter: blur(6px);
        text-shadow: 0 0 8px rgba(0, 246, 255, 0.6);
      }
      #hint b {
        color: #ff2d95;
      }
      #hint.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="scoreboard">
        Neutralized
        <span id="kills">00</span>
      </div>
      <div id="hint">
        Klik om te spelen · <b>WASD</b> lopen · <b>Shift</b> sprinten ·
        <b>Muis</b> mikken · <b>Klik</b> schieten · cyber-binnenhof
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
