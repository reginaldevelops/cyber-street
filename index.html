<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Street</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        font-family: 'Courier New', ui-monospace, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #c8f7ff;
      }
      /* Vignette + subtiele scanlines voor de cyberpunk-look */
      #hud::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(5, 2, 14, 0.55) 100%
        );
      }
      #hud::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 255, 255, 0.02) 3px,
          rgba(0, 255, 255, 0.02) 4px
        );
        mix-blend-mode: overlay;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid rgba(0, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 0, 170, 0.9);
      }
      #crosshair::before {
        left: 50%;
        top: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair::after {
        left: 50%;
        bottom: -6px;
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair.hit {
        animation: hitmark 0.18s ease-out;
      }
      @keyframes hitmark {
        0% {
          transform: scale(1);
          border-color: rgba(255, 45, 149, 1);
          box-shadow: 0 0 20px rgba(255, 45, 149, 0.9);
        }
        100% {
          transform: scale(1.45);
          border-color: rgba(0, 255, 255, 0.85);
          box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        }
      }
      #scoreboard {
        position: absolute;
        top: 22px;
        left: 26px;
        padding: 10px 18px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        border-left: 3px solid rgba(255, 45, 149, 0.9);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 12px;
      }
      #scoreboard #kills {
        display: block;
        margin-top: 2px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #ff2d95;
        text-shadow: 0 0 14px rgba(255, 45, 149, 0.8);
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        padding: 12px 20px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-align: center;
        backdrop-filter: blur(6px);
        text-shadow: 0 0 8px rgba(0, 246, 255, 0.6);
      }
      #hint b {
        color: #ff2d95;
      }
      #crosshair.hidden,
      #scoreboard.hidden,
      #concept-panel.hidden,
      #hint.hidden {
        display: none;
      }
      #concept-panel {
        position: absolute;
        top: 22px;
        right: 26px;
        width: 280px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 45, 149, 0.4);
        border-right: 3px solid rgba(0, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.45;
        letter-spacing: 0.04em;
      }
      #concept-panel .concept-title {
        font-size: 14px;
        font-weight: 700;
        color: #00f6ff;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 4px;
      }
      #concept-panel .concept-tag {
        color: #ff2d95;
        font-size: 11px;
        margin-bottom: 8px;
      }
      #concept-panel .concept-pitch {
        color: #b8c8d8;
        margin-bottom: 10px;
      }
      #concept-panel .concept-keys {
        font-size: 11px;
        color: #8899aa;
        border-top: 1px solid rgba(0, 255, 255, 0.2);
        padding-top: 8px;
      }
      #concept-panel b {
        color: #ff2d95;
      }
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(8, 4, 18, 0.72) 0%,
          rgba(2, 2, 8, 0.94) 70%
        );
        backdrop-filter: blur(3px);
        pointer-events: auto;
      }
      #start-screen.hidden {
        display: none;
      }
      #start-screen::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 255, 255, 0.03) 3px,
          rgba(0, 255, 255, 0.03) 4px
        );
        pointer-events: none;
      }
      #start-panel {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 48px 56px 42px;
        border: 1px solid rgba(0, 255, 255, 0.35);
        border-top: 3px solid rgba(255, 45, 149, 0.9);
        background: rgba(0, 0, 0, 0.62);
        box-shadow:
          0 0 40px rgba(0, 246, 255, 0.12),
          inset 0 0 60px rgba(255, 45, 149, 0.04);
        min-width: 320px;
      }
      #start-title {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #00f6ff;
        text-shadow: 0 0 24px rgba(0, 246, 255, 0.75);
        margin-bottom: 8px;
      }
      #start-subtitle {
        font-size: 13px;
        letter-spacing: 0.28em;
        color: #ff2d95;
        text-transform: uppercase;
        margin-bottom: 36px;
      }
      #start-audio-hint {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #8899aa;
        margin-bottom: 18px;
        min-height: 16px;
      }
      #start-audio-hint.hidden {
        display: none;
      }
      #play-btn {
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #050508;
        background: linear-gradient(135deg, #00f6ff 0%, #ff2d95 100%);
        border: none;
        padding: 14px 48px;
        cursor: pointer;
        box-shadow: 0 0 22px rgba(0, 246, 255, 0.45);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      #play-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 0 32px rgba(255, 45, 149, 0.55);
      }
      #play-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="scoreboard">
        Neutralized
        <span id="kills">00</span>
      </div>
      <div id="concept-panel" class="hidden"></div>
      <div id="hint" class="hidden">
        <b>WASD</b> lopen · <b>Shift</b> sprinten ·
        <b>Muis</b> kijken · <b>1–4</b> grate-variant
      </div>
    </div>
    <div id="start-screen">
      <div id="start-panel">
        <div id="start-title">CYBER STREET</div>
        <div id="start-subtitle">Neon Alley</div>
        <div id="start-audio-hint">Klik ergens voor muziek</div>
        <button id="play-btn" type="button">Play</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
